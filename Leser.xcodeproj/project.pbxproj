			shellScript = "# Build number = number of Git commits, so every build of a new state counts up.\n# Without a Git repository the value from the project (CURRENT_PROJECT_VERSION) stays.\nif git -C \"$SRCROOT\" rev-parse --is-inside-work-tree > /dev/null 2>&1; then\n    build=$(git -C \"$SRCROOT\" rev-list --count HEAD 2> /dev/null || echo \"\")\n    if [ -n \"$build\" ]; then\n        /usr/libexec/PlistBuddy -c \"Set :CFBundleVersion $build\" \"$TARGET_BUILD_DIR/$INFOPLIST_PATH\"\n        echo \"Build-Nummer: $build\"\n    fi\nfi\n";
